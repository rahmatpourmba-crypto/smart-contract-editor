<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solidity Editor - Smart Contract IDE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>Smart Contract Editor</h1>
        <button id="btn-new-file" title="New file">+ New</button>
      </div>
      <ul id="file-list"></ul>
      <div class="sidebar-footer">
        <select id="solc-version">
          <option value="0.8.36" selected>solc 0.8.36</option>
          <option value="0.8.26">solc 0.8.26</option>
          <option value="0.8.20">solc 0.8.20</option>
          <option value="0.8.10">solc 0.8.10</option>
          <option value="0.8.0">solc 0.8.0</option>
          <option value="0.7.6">solc 0.7.6</option>
          <option value="0.6.12">solc 0.6.12</option>
        </select>
        <div id="solc-status">Loading compiler...</div>
      </div>
    </aside>

    <main id="main">
      <header id="toolbar">
        <div id="tabs"></div>
        <div class="toolbar-actions">
          <label id="opt-label">
            <input type="checkbox" id="chk-optimize" /> Optimize
          </label>
          <button id="btn-compile">Compile</button>
        </div>
      </header>

      <div id="editor-wrap"></div>

      <section id="output">
        <div class="output-tabs">
          <button class="out-tab active" data-panel="errors">Errors</button>
          <button class="out-tab" data-panel="abi">ABI</button>
          <button class="out-tab" data-panel="bytecode">Bytecode</button>
          <button class="out-tab" data-panel="deployed">Deployed</button>
        </div>
        <div id="panel-errors" class="out-panel active">
          <p class="muted">No compilation yet. Click Compile.</p>
        </div>
        <div id="panel-abi" class="out-panel">
          <pre id="abi-output" class="muted">—</pre>
        </div>
        <div id="panel-bytecode" class="out-panel">
          <pre id="bytecode-output" class="muted">—</pre>
        </div>
        <div id="panel-deployed" class="out-panel">
          <pre id="deployed-output" class="muted">—</pre>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
